name: CI - Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# O GITHUB_TOKEN só lê o repositório (nenhum job publica nada).
permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # O Maven Wrapper baixa o Maven a cada execução; uma falha de rede nesse download derrubava o CI.
      - name: Cache Maven Wrapper
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('backend/.mvn/wrapper/maven-wrapper.properties') }}

      # Testes de integração contra PostgreSQL e Redis de verdade (Testcontainers usa o Docker do runner), com os
      # mesmos três usuários do banco da produção (o teste de RLS não provaria nada como superusuário).
      # Inclui o contrato (a API gerada precisa ser igual a docs/openapi.json) e as fronteiras de módulos (ArchUnit).
      # Falha se a cobertura de linhas ou de ramos não for 100% (docs/testes.md).
      - name: Build, Test and Coverage check (JaCoCo)
        run: ./mvnw -B clean verify

  # Teste de mutação: mínimo 95% em cada área. Fora do job do Backend e dividido por área, em paralelo — o PR espera o
  # job mais lento, não a soma (com tudo num job só, a mutação passou de 35 min na fase 1c). Cada área roda só os
  # testes dela e de quem a usa.
  mutation:
    name: Mutação (${{ matrix.area }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - area: segurança
            classes: com.sskings.agendai.security.*,com.sskings.agendai.auth.*,com.sskings.agendai.config.ProductionConfigValidator*
            tests: com.sskings.agendai.security.*Test,com.sskings.agendai.auth.*Test,com.sskings.agendai.config.ProductionConfigValidatorTest
          - area: catálogo e agenda
            classes: com.sskings.agendai.catalog.*,com.sskings.agendai.schedule.*,com.sskings.agendai.tenant.TenantAccess
            # os agendamentos usam o catálogo e a agenda (offer, calendar): os testes deles também matam mutantes aqui
            tests: com.sskings.agendai.catalog.*Test,com.sskings.agendai.schedule.*Test,com.sskings.agendai.booking.*Test
          - area: agendamentos
            classes: com.sskings.agendai.booking.*
            # a regra "profissional só na própria agenda" é testada junto com o convite (quem cria o vínculo)
            tests: com.sskings.agendai.booking.*Test,com.sskings.agendai.catalog.InviteIntegrationTest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven Wrapper
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('backend/.mvn/wrapper/maven-wrapper.properties') }}

      - name: Mutation testing (PIT)
        env:
          CLASSES: ${{ matrix.classes }}
          TESTS: ${{ matrix.tests }}
        run: ./mvnw -B test-compile pitest:mutationCoverage "-DtargetClasses=$CLASSES" "-DtargetTests=$TESTS"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/tools/openapi/package-lock.json

      - run: npm ci
      - name: Dependency audit (npm)
        run: npm audit --omit=dev --audit-level=high
      # Os tipos da API (src/api/schema.d.ts) precisam ser os gerados de docs/openapi.json.
      - name: API contract (tipos gerados do OpenAPI)
        run: npm run contract:check
      - name: Type check
        run: npx tsc -b
      - name: Lint
        run: npm run lint
      - name: Test and Coverage check (Vitest)
        run: npm run coverage
      - name: Production build
        run: npm run build

  migrations:
    name: Migrações
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Migração aplicada em produção não pode mudar (o Flyway recusaria subir): só se acrescentam arquivos novos.
      - name: Migrações existentes não foram editadas
        env:
          BASE: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-status "origin/$BASE...HEAD" -- backend/src/main/resources/db/migration | grep -v '^A' || true)
          if [ -n "$changed" ]; then
            echo "::error::Migração existente alterada, renomeada ou removida. Crie uma nova (V<n+1>__...sql):"
            echo "$changed"
            exit 1
          fi
          echo "ok: só migrações novas"

  production:
    name: Produção (E2E, upgrade e scan)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      PROJECT: agendai-ci
      URL: https://localhost:18443
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Segredos e certificado de teste (gerados na hora, descartados no fim)
        run: |
          cat > deploy/.env.prod <<EOF
          DATABASE_NAME=agendai
          DATABASE_ADMIN_USERNAME=postgres
          DATABASE_ADMIN_PASSWORD=$(openssl rand -hex 24)
          DATABASE_MIGRATION_USERNAME=agendai_owner
          DATABASE_MIGRATION_PASSWORD=$(openssl rand -hex 24)
          DATABASE_USERNAME=agendai_app
          DATABASE_PASSWORD=$(openssl rand -hex 24)
          REDIS_PASSWORD=$(openssl rand -hex 24)
          JWT_SECRET=$(openssl rand -hex 32)
          CORS_ALLOWED_ORIGINS=https://localhost:18443
          HTTP_PORT=18080
          HTTPS_PORT=18443
          EOF
          chmod 600 deploy/.env.prod
          mkdir -p deploy/certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=localhost" \
            -keyout deploy/certs/privkey.pem -out deploy/certs/fullchain.pem 2>/dev/null
          chmod 644 deploy/certs/privkey.pem   # o nginx roda sem root (uid 101) e precisa ler a chave (descartável)
          # o nginx não tem healthcheck: esperar o HTTPS responder antes do E2E
          cat > ../wait-https.sh <<'EOS'
          for i in $(seq 1 60); do curl -skf -o /dev/null "$1/" && exit 0; sleep 2; done
          echo "::error::$1 não respondeu"; exit 1
          EOS

      # PR: sobe a versão da main, cria dados, e só então sobe a do PR por cima — as migrações novas rodam sobre um
      # banco com dados, como num deploy de verdade.
      - name: Upgrade — sobe a versão atual da main e cria dados
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git worktree add -q ../base "origin/$BASE"
          if [ ! -f ../base/deploy/docker-compose.prod.yml ]; then
            echo "a $BASE ainda não tem pilha de produção: upgrade pulado (só no primeiro PR)"
            exit 0
          fi
          cp -r deploy/.env.prod deploy/certs ../base/deploy/
          docker compose -p "$PROJECT" -f ../base/deploy/docker-compose.prod.yml --env-file ../base/deploy/.env.prod \
            up -d --build --wait --wait-timeout 300
          bash ../wait-https.sh "$URL"
          python3 ../base/deploy/e2e-smoke.py "$URL"
          sleep 61   # o nginx limita cadastro/login a 10 por minuto por IP

      # Como num deploy de verdade: o banco sobe primeiro e os scripts de db-init (idempotentes: papéis, extensões)
      # rodam de novo com o superusuário — o entrypoint só os roda com o volume vazio — antes de a API nova migrar.
      - name: Sobe a versão do PR (db-init de novo, migrações sobre os dados existentes)
        run: |
          compose() { docker compose -p "$PROJECT" -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod "$@"; }
          compose up -d --wait --wait-timeout 120 db
          compose exec -T db sh -c 'for f in /docker-entrypoint-initdb.d/*.sh; do bash "$f" || exit 1; done'
          compose up -d --build --wait --wait-timeout 300

      - name: Teste ponta a ponta (nginx TLS → API → PostgreSQL e Redis)
        run: |
          bash ../wait-https.sh "$URL"
          python3 deploy/e2e-smoke.py "$URL"

      # Barra vulnerabilidade HIGH/CRITICAL que já tem correção. Exceções justificadas e com validade: .trivyignore.yaml
      # A lista vem do compose (com o digest: imagem fixada só por digest não tem tag). O PostgreSQL fica de fora: as
      # falhas que sobram são de binários Go da imagem oficial (gosu), sem correção possível aqui, e o banco só existe
      # na rede interna "data". O Dependabot atualiza o digest.
      - name: Scan das imagens (Trivy)
        run: |
          images=$(docker compose -p "$PROJECT" -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod config --images | grep -v '^postgres')
          test -n "$images"
          for image in $images; do
            echo "::group::$image"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/.trivyignore.yaml:/ignore.yaml:ro" \
              aquasec/trivy@sha256:ab70a02200597efa04748f210f793936eb647cbcdb0ea69cc30b226d6f5a22c7 \
              image --quiet --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --ignorefile /ignore.yaml --exit-code 1 "$image"
            echo "::endgroup::"
          done

      - name: Logs (em caso de falha)
        if: failure()
        run: docker compose -p "$PROJECT" -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod logs --tail 200

      - name: Derruba a pilha
        if: always()
        run: docker compose -p "$PROJECT" -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod down -v || true
