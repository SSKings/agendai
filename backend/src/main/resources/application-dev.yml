# Desenvolvimento: `./mvnw spring-boot:run` sobe PostgreSQL (com os três usuários) e Redis do compose.yaml.
spring:
  docker:
    compose:
      file: compose.yaml
      lifecycle-management: start-only
  datasource:
    url: jdbc:postgresql://localhost:5435/agendai
    username: agendai_app
    password: dev-app-password
  flyway:
    user: agendai_owner
    password: dev-owner-password
  mail:
    host: localhost
    port: 1025                   # Mailpit do compose.yaml: e-mails em http://localhost:8025
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.required: false
  rabbitmq:
    port: 5673                   # RabbitMQ do compose.yaml (painel não incluso)
    username: agendai
    password: dev-rabbit-password
  data:
    redis:
      port: 6380
      password: dev-redis-password

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

agendai:
  jwt:
    secret: ${JWT_SECRET:${random.value}${random.value}}   # aleatório a cada start: tokens de dev não sobrevivem ao restart
  refresh:
    secure-cookie: false         # http://localhost: o navegador não manda cookie Secure sem https
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
