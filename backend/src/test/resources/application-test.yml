# Testes: PostgreSQL e Redis de verdade (Testcontainers); conexões definidas em TestcontainersConfiguration.
spring:
  docker:
    compose:
      enabled: false
  datasource:
    hikari:
      # os testes de concorrência disparam 100 requisições de uma vez numa máquina compartilhada (CI): aqui o pool
      # espera mais que em produção (5 s, application.yml); o que se mede nesses testes é a regra do banco, não a fila
      connection-timeout: 30000
agendai:
  outbox:
    publish-every: PT0.2S
  worker:
    retry-delay: PT1S            # as mesmas regras, sem esperar minutos nos testes
    max-attempts: 4
  pending:
    expiry-every: PT1H           # o job de expiração não roda sozinho no meio dos testes (eles o chamam direto)
  jwt:
    secret: test-secret-only-for-tests-0123456789-abcdefghijklmnopqrstuvwxyz
  refresh:
    secure-cookie: true
  cors:
    allowed-origins: http://localhost:5173
