# Pilha de produção do Agendaí: PostgreSQL + Redis + API (perfil prod) + nginx (TLS, front-end e proxy de /api).
# Uso:  cp .env.prod.example .env.prod  → preencha  →  coloque fullchain.pem e privkey.pem em ./certs
#       docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Todos os containers sem root, sem capacidades extras e (menos o banco) com sistema de arquivos só leitura.
name: agendai

# Logs com tamanho máximo: sem isto, o json-file do Docker guarda tudo e pode encher o disco.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  db:
    logging: *logging
    image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-agendai}
      # superusuário: só cria o banco e os papéis (db-init/01-roles.sh); a API nunca o usa
      POSTGRES_USER: ${DATABASE_ADMIN_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_ADMIN_PASSWORD:?defina DATABASE_ADMIN_PASSWORD}
      DATABASE_MIGRATION_USERNAME: ${DATABASE_MIGRATION_USERNAME:?}
      DATABASE_MIGRATION_PASSWORD: ${DATABASE_MIGRATION_PASSWORD:?}
      DATABASE_USERNAME: ${DATABASE_USERNAME:?}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    networks: [data]          # rede interna: o nginx não alcança o banco e o banco não sai para a internet
    mem_limit: ${DB_MEM_LIMIT:-512m}
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DATABASE_ADMIN_USERNAME:-postgres}", "-d", "${DATABASE_NAME:-agendai}"]
      interval: 10s
      retries: 10

  redis:
    logging: *logging
    build: ./redis              # imagem oficial fixada por digest + apk upgrade (redis/Dockerfile)
    restart: unless-stopped
    user: "999:1000"          # usuário redis da imagem: sem passar pelo root do entrypoint
    # dados temporários (contadores com validade): sem gravação em disco; memória limitada, descarta os que vencem antes
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?defina REDIS_PASSWORD}", "--save", "", "--appendonly", "no",
              "--maxmemory", "64mb", "--maxmemory-policy", "volatile-ttl"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?}
    networks: [data]
    mem_limit: ${REDIS_MEM_LIMIT:-128m}
    read_only: true
    tmpfs: [/data]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 10

  api:
    logging: *logging
    build: ../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://db:5432/${DATABASE_NAME:-agendai}
      DATABASE_USERNAME: ${DATABASE_USERNAME:?}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?}
      DATABASE_MIGRATION_USERNAME: ${DATABASE_MIGRATION_USERNAME:?}
      DATABASE_MIGRATION_PASSWORD: ${DATABASE_MIGRATION_PASSWORD:?}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?defina CORS_ALLOWED_ORIGINS}
      # SMTP do provedor (código de confirmação do agendamento): STARTTLS obrigatório por padrão
      MAIL_HOST: ${MAIL_HOST:?defina MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Agendaí <nao-responda@agendai.app>}
      MAIL_AUTH: ${MAIL_AUTH:-true}
      MAIL_STARTTLS_REQUIRED: ${MAIL_STARTTLS_REQUIRED:-true}
    networks: [edge, data]          # edge: sai para o SMTP do provedor
    mem_limit: ${API_MEM_LIMIT:-768m}
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  web:
    logging: *logging
    build: ../frontend
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "${HTTP_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./proxy-api.inc:/etc/nginx/conf.d/proxy-api.inc:ro
      - ./security-headers.inc:/etc/nginx/conf.d/security-headers.inc:ro
      - ./certs:/etc/nginx/certs:ro
    networks: [edge]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: ${WEB_MEM_LIMIT:-128m}

networks:
  edge: {}
  data:
    internal: true

volumes:
  db-data: {}
