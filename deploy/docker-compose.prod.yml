# Pilha de produção do Agendaí: PostgreSQL + Redis + RabbitMQ + backend em três papéis (a mesma imagem: migrate roda e
# sai; api atende o HTTP; worker publica o outbox e consome as filas) + nginx (TLS, front-end e proxy de /api).
# Uso:  cp .env.prod.example .env.prod  → preencha  →  coloque fullchain.pem e privkey.pem em ./certs
#       docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Todos os containers sem root, sem capacidades extras e (menos o banco) com sistema de arquivos só leitura.
name: agendai

# Logs com tamanho máximo: sem isto, o json-file do Docker guarda tudo e pode encher o disco.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  db:
    logging: *logging
    image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-agendai}
      # superusuário: só cria o banco e os papéis (db-init/01-roles.sh); a API nunca o usa
      POSTGRES_USER: ${DATABASE_ADMIN_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_ADMIN_PASSWORD:?defina DATABASE_ADMIN_PASSWORD}
      DATABASE_MIGRATION_USERNAME: ${DATABASE_MIGRATION_USERNAME:?}
      DATABASE_MIGRATION_PASSWORD: ${DATABASE_MIGRATION_PASSWORD:?}
      DATABASE_USERNAME: ${DATABASE_USERNAME:?}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    networks: [data]          # rede interna: o nginx não alcança o banco e o banco não sai para a internet
    mem_limit: ${DB_MEM_LIMIT:-512m}
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DATABASE_ADMIN_USERNAME:-postgres}", "-d", "${DATABASE_NAME:-agendai}"]
      interval: 10s
      retries: 10

  redis:
    logging: *logging
    build: ./redis              # imagem oficial fixada por digest + apk upgrade (redis/Dockerfile)
    restart: unless-stopped
    user: "999:1000"          # usuário redis da imagem: sem passar pelo root do entrypoint
    # dados temporários (contadores com validade): sem gravação em disco; memória limitada, descarta os que vencem antes
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?defina REDIS_PASSWORD}", "--save", "", "--appendonly", "no",
              "--maxmemory", "64mb", "--maxmemory-policy", "volatile-ttl"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?}
    networks: [data]
    mem_limit: ${REDIS_MEM_LIMIT:-128m}
    read_only: true
    tmpfs: [/data]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 10

  # eventos (ADR-003): o outbox publica aqui, o worker consome. Só na rede interna; mensagens e filas em disco.
  rabbitmq:
    logging: *logging
    image: rabbitmq:4.1-alpine@sha256:146b4c1ceed64aa5ac1931f5bf1aac1b10ad0ac8193773410e0c1d15050f8ec7
    restart: unless-stopped
    hostname: rabbitmq            # o nome do nó fica estável entre recriações (os dados ficam no volume)
    user: "100:101"               # usuário rabbitmq da imagem: sem passar pelo root do entrypoint
    # sem usuário administrador: os da aplicação vêm do rabbitmq-init (o guest da imagem só entra pelo localhost do
    # próprio container, e o init o apaga)
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/90-agendai.conf:/etc/rabbitmq/conf.d/90-agendai.conf:ro   # memória, WAL, disco
    networks: [data]
    mem_limit: ${RABBITMQ_MEM_LIMIT:-512m}
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 12

  # Usuário do RabbitMQ do worker, com o mínimo de permissão (rabbitmq/init-users.sh). Roda a cada `up`: trocar a senha
  # no .env.prod e subir de novo troca no broker. Fala com o nó pelo cookie do Erlang (volume, só leitura).
  rabbitmq-init:
    logging: *logging
    image: rabbitmq:4.1-alpine@sha256:146b4c1ceed64aa5ac1931f5bf1aac1b10ad0ac8193773410e0c1d15050f8ec7
    restart: "no"
    depends_on:
      rabbitmq:
        condition: service_healthy
    user: "100:101"
    entrypoint: ["sh", "/init-users.sh"]
    environment:
      HOME: /var/lib/rabbitmq       # onde o rabbitmqctl acha o cookie
      RABBITMQ_WORKER_PASSWORD: ${RABBITMQ_WORKER_PASSWORD:?defina RABBITMQ_WORKER_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq:ro
      - ./rabbitmq/init-users.sh:/init-users.sh:ro
    networks: [data]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  # Papel migrate: aplica as migrações com o dono das tabelas e sai. Só ele recebe essa senha; a API e o worker sobem
  # depois dele e não dependem um do outro.
  migrate:
    logging: *logging
    build: ../backend
    image: agendai-backend:local    # a mesma imagem serve os três papéis
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod,migrate
      DATABASE_URL: jdbc:postgresql://db:5432/${DATABASE_NAME:-agendai}
      DATABASE_USERNAME: ${DATABASE_USERNAME:?}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?}
      DATABASE_POOL_SIZE: 2
      DATABASE_MIGRATION_USERNAME: ${DATABASE_MIGRATION_USERNAME:?}
      DATABASE_MIGRATION_PASSWORD: ${DATABASE_MIGRATION_PASSWORD:?}
    healthcheck:
      disable: true                 # roda e sai
    networks: [data]
    mem_limit: ${MIGRATE_MEM_LIMIT:-512m}
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  # Papel api: atende o HTTP (atrás do nginx). Não fala com o RabbitMQ (o outbox é só uma tabela) nem migra o banco.
  api:
    logging: *logging
    build: ../backend
    image: agendai-backend:local
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod,api
      DATABASE_URL: jdbc:postgresql://db:5432/${DATABASE_NAME:-agendai}
      DATABASE_USERNAME: ${DATABASE_USERNAME:?}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?defina CORS_ALLOWED_ORIGINS}
      # SMTP do provedor (código de confirmação do agendamento): STARTTLS obrigatório por padrão
      PUBLIC_URL: ${PUBLIC_URL:?defina PUBLIC_URL (https do front, vai nos links dos e-mails)}
      MAIL_HOST: ${MAIL_HOST:?defina MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Agendaí <nao-responda@agendai.app>}
      MAIL_AUTH: ${MAIL_AUTH:-true}
      MAIL_STARTTLS_REQUIRED: ${MAIL_STARTTLS_REQUIRED:-true}
    networks: [edge, data]          # edge: o nginx a alcança, e ela sai para o SMTP do provedor
    mem_limit: ${API_MEM_LIMIT:-768m}
    healthcheck:                    # o mesmo da imagem, mas checando a cada 2 s enquanto sobe
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      start_interval: 2s
      retries: 3
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  # Papel worker: publica o outbox, consome as filas (e-mails), declara a topologia no RabbitMQ e roda os jobs de
  # manutenção. Sem porta da API; o health fica no localhost do container (só o healthcheck o vê). Não recebe JWT, Redis
  # nem o dono das tabelas. Escala com --scale worker=N (outbox com SKIP LOCKED, jobs idempotentes).
  worker:
    logging: *logging
    build: ../backend
    image: agendai-backend:local
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: prod,worker
      # heap menor que o da API: o resto do container é metaspace, code cache e pilhas das threads
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60 -XX:MaxMetaspaceSize=160m -XX:+ExitOnOutOfMemoryError
      DATABASE_URL: jdbc:postgresql://db:5432/${DATABASE_NAME:-agendai}
      DATABASE_USERNAME: ${DATABASE_USERNAME:?}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?}
      DATABASE_POOL_SIZE: ${WORKER_DATABASE_POOL_SIZE:-5}   # 2 consumidores + outbox + 2 jobs
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: agendai_worker
      RABBITMQ_PASSWORD: ${RABBITMQ_WORKER_PASSWORD:?}
      MAIL_HOST: ${MAIL_HOST:?defina MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Agendaí <nao-responda@agendai.app>}
      MAIL_AUTH: ${MAIL_AUTH:-true}
      MAIL_STARTTLS_REQUIRED: ${MAIL_STARTTLS_REQUIRED:-true}
    networks: [egress, data]        # egress: só a saída para o SMTP (o nginx, no edge, não o alcança)
    mem_limit: ${WORKER_MEM_LIMIT:-512m}
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      start_interval: 2s
      retries: 3

  web:
    logging: *logging
    build: ../frontend
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "${HTTP_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./proxy-api.inc:/etc/nginx/conf.d/proxy-api.inc:ro
      - ./security-headers.inc:/etc/nginx/conf.d/security-headers.inc:ro
      - ./certs:/etc/nginx/certs:ro
    networks: [edge]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: ${WEB_MEM_LIMIT:-128m}

networks:
  edge: {}
  egress: {}          # só saída (SMTP do worker): sem o nginx
  data:
    internal: true

volumes:
  db-data: {}
  rabbitmq-data: {}
