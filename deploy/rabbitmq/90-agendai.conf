# Produção (docker-compose.prod.yml): um nó, filas quorum, container com 512 MB.
# O WAL do Raft (padrão 512 MiB) não pode ser do tamanho da memória inteira do container.
raft.wal_max_size_bytes = 67108864
# alarme de memória (bloqueia publicações) antes do OOM: o RabbitMQ calcula o relativo sobre a memória da MÁQUINA,
# não do container — então em absoluto, abaixo do mem_limit (512 MB no compose)
vm_memory_high_watermark.absolute = 320MiB
# disco livre mínimo antes de bloquear publicações
disk_free_limit.absolute = 256MB
# o guest da imagem só entra pelo localhost do próprio container, e o rabbitmq-init o apaga logo depois da subida
loopback_users.guest = true
